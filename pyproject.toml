[project]
name = "backend"
version = "0.1.0"
description = "Secure Coding Room backend: multi-agent orchestration and code runner."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bandit>=1.9.4",
    "fastapi>=0.141.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]
[tool.uv]
# The project lives in OneDrive, which rejects hardlinks; copy packages into .venv instead.
link-mode = "copy"

[tool.ruff]
# Participant-facing task code, not backend code.
extend-exclude = ["starter", "workspaces", "snapshots"]

[tool.pytest.ini_options]
# Let tests import modules from the project root (e.g. `from main import app`).
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
